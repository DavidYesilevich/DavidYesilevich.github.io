<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | Portfolio</title>
  <meta name="description" content="Read more about my background, school education, skills, and current focus areas.">
  <link rel="stylesheet" href="style.css">
</head>
<body id="about-page">

  <!-- ==========================================
       NAVIGATION HEADER
       ========================================== -->
  <header>
    <div class="container nav-container">
      <a href="index.html" class="nav-brand" aria-label="Go to Homepage">
        <div id="header-monogram-wrapper" class="brand-monogram" data-field="initials">YN</div>
        <span data-field="name">YOUR NAME</span>
      </a>
      
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="experience.html" class="nav-link">Experience</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      
      <div class="nav-controls">
        <div class="accent-swatches" aria-label="Choose accent color">
          <button class="swatch swatch-sage" data-accent="sage" aria-label="Sage Green"></button>
          <button class="swatch swatch-ocean" data-accent="ocean" aria-label="Ocean Blue"></button>
          <button class="swatch swatch-terracotta" data-accent="terracotta" aria-label="Terracotta Rust"></button>
          <button class="swatch swatch-plum" data-accent="plum" aria-label="Plum Purple"></button>
          <button class="swatch swatch-slate" data-accent="slate" aria-label="Slate Gray"></button>
        </div>

        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT CONTAINER
       ========================================== -->
  <main class="container">
    
    <!-- Profile / Story Section -->
    <section class="section-row" aria-labelledby="about-title">
      <div class="row-label">
        <h2 id="about-title">My Story</h2>
      </div>
      <!-- Long Bio paragraph targets -->
      <!-- EDIT THIS IN script.js -> portfolioData.about.long -->
      <div class="row-content" id="about-long">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Education Section -->
    <section class="section-row" aria-labelledby="education-title">
      <div class="row-label">
        <h2 id="education-title">Education</h2>
      </div>
      <!-- Education list target -->
      <!-- EDIT THIS IN script.js -> portfolioData.education -->
      <div class="row-content" id="education-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Skills Section -->
    <section class="section-row" aria-labelledby="skills-title">
      <div class="row-label">
        <h2 id="skills-title">Skills</h2>
      </div>
      <div class="row-content">
        <p>A summary of tools, frameworks, and programming languages I have explored in coursework and self-directed study.</p>
        
        <!-- Skills tags target -->
        <!-- EDIT THIS IN script.js -> portfolioData.skills -->
        <div class="skills-grid" id="skills-container">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

    <!-- Interests Section -->
    <section class="section-row" aria-labelledby="interests-title">
      <div class="row-label">
        <h2 id="interests-title">Interests</h2>
      </div>
      <!-- Interests list target -->
      <!-- EDIT THIS IN script.js -> portfolioData.interests -->
      <div class="row-content" id="interests-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- ==========================================
       FOOTER
       ========================================== -->
  <footer>
    <div class="container">
      <p>&copy; <span id="footer-year">2026</span> <span data-field="name">YOUR NAME</span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
