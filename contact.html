<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Portfolio</title>
  <meta name="description" content="Get in touch for internships, projects, or collaborations.">
  <link rel="stylesheet" href="style.css">
</head>
<body id="contact-page">

  <!-- ==========================================
       NAVIGATION HEADER
       ========================================== -->
  <header>
    <div class="container nav-container">
      <a href="index.html" class="nav-brand" aria-label="Go to Homepage">
        <div id="header-monogram-wrapper" class="brand-monogram" data-field="initials">YN</div>
        <span data-field="name">YOUR NAME</span>
      </a>
      
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="experience.html" class="nav-link">Experience</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      
      <div class="nav-controls">
        <div class="accent-swatches" aria-label="Choose accent color">
          <button class="swatch swatch-sage" data-accent="sage" aria-label="Sage Green"></button>
          <button class="swatch swatch-ocean" data-accent="ocean" aria-label="Ocean Blue"></button>
          <button class="swatch swatch-terracotta" data-accent="terracotta" aria-label="Terracotta Rust"></button>
          <button class="swatch swatch-plum" data-accent="plum" aria-label="Plum Purple"></button>
          <button class="swatch swatch-slate" data-accent="slate" aria-label="Slate Gray"></button>
        </div>
        
        <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle light and dark mode">
          <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.01c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24"><path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.3-9.7.7-.1 1.3.4 1.3 1.1 0 .4-.2.8-.5 1-1.6 1.5-2.5 3.6-2.5 5.8 0 4.4 3.6 8 8 8 2.2 0 4.3-.9 5.8-2.5.3-.3.7-.5 1.1-.5.7 0 1.2.6 1.1 1.3-.9 4.8-5 8.3-9.7 8.3z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT CONTAINER
       ========================================== -->
  <main class="container">
    
    <!-- Contact Info Section -->
    <section class="section-row" aria-labelledby="contact-title">
      <div class="row-label">
        <h2 id="contact-title">Contact</h2>
      </div>
      <div class="row-content contact-container">
        <!-- Contact Intro Paragraph -->
        <!-- EDIT THIS IN script.js -> portfolioData.contact.intro -->
        <p class="contact-intro-text" id="contact-intro">YOUR CONTACT CTA INTRO</p>
        
        <!-- Grid of Contact Link Cards -->
        <div class="contact-links">
          
          <!-- Email Card -->
          <a href="#" class="contact-card" id="contact-email-card" aria-label="Send email">
            <div class="contact-icon">
              <!-- Envelope Icon -->
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">Email</span>
              <span class="contact-value">YOUR EMAIL</span>
            </div>
          </a>

          <!-- LinkedIn Card -->
          <a href="#" class="contact-card" id="contact-linkedin-card" target="_blank" rel="noopener noreferrer" aria-label="Visit LinkedIn Profile">
            <div class="contact-icon">
              <!-- LinkedIn Icon -->
              <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.8v8.37h2.8v-4.87c0-.26.05-.52.13-.7a1.11 1.11 0 0 1 .97-.7c.7 0 1 .56 1 1.39v4.88h2.8M6.5 8.37a1.37 1.37 0 1 0 0-2.75 1.37 1.37 0 0 0 0 2.75M8 18.5V10.1H5v8.4h3z"/></svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">LinkedIn</span>
              <span class="contact-value">YOUR LINKEDIN URL</span>
            </div>
          </a>

          <!-- GitHub Card -->
          <a href="#" class="contact-card" id="contact-github-card" target="_blank" rel="noopener noreferrer" aria-label="Visit GitHub Profile">
            <div class="contact-icon">
              <!-- GitHub Icon -->
              <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">GitHub</span>
              <span class="contact-value">YOUR GITHUB URL</span>
            </div>
          </a>

        </div>
      </div>
    </section>

  </main>

  <!-- ==========================================
       FOOTER
       ========================================== -->
  <footer>
    <div class="container">
      <p>&copy; <span id="footer-year">2026</span> <span data-field="name">YOUR NAME</span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
